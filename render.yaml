# Render Blueprint -- lets Render set up the web service + Postgres database
# together from this one file, instead of clicking through the dashboard by
# hand. In the Render dashboard: New -> Blueprint -> point it at this repo.
#
# Secrets and org-specific values (RAZORPAY_*, ORG_*, SMTP_*, SENTRY_DSN,
# etc.) are deliberately left out of this file (sync: false below) so
# nothing sensitive ends up committed to git -- fill those in once under the
# service's Environment tab after the first deploy. See README "Deploying
# to Render" for the full list and what each one does.

services:
  - type: web
    name: temple-donation-system
    runtime: python
    plan: starter   # Free tier has no persistent disk (see disk: below) and
                     # spins down when idle -- fine for testing, not for
                     # real donation traffic issuing legal 80G receipts.
    buildCommand: pip install -r requirements.txt
    # Runs `flask db upgrade` against the new code+migrations before Render
    # swaps traffic over to the new instance -- closes the race where the
    # old instance (or this same instance's own db.create_all() call in
    # app.py, which auto-creates any table missing from the current models
    # on every boot) creates a table first, and a later manual
    # `flask db upgrade` then collides with it (DuplicateTable). If your
    # Render plan doesn't support preDeployCommand, delete this line and go
    # back to running `flask db upgrade` by hand from the Render Shell
    # *before* redeploying -- see README "Database migrations".
    preDeployCommand: flask db upgrade
    startCommand: gunicorn -c gunicorn_config.py app:app
    disk:
      name: temple-data
      # Covers both the SQLite file (if you don't switch to the Postgres
      # database below) and generated receipt PDFs -- both live under
      # instance/ relative to the app root.
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: temple-donation-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      # --- Fill these in manually in the Render dashboard (Environment tab) ---
      - key: ORG_NAME
        sync: false
      - key: ORG_PAN
        sync: false
      - key: ORG_80G_REG_NO
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WHATSAPP_AIRTEL_USERNAME
        sync: false
      - key: WHATSAPP_AIRTEL_PASSWORD
        sync: false
      - key: WHATSAPP_FROM_NUMBER
        sync: false
      - key: WHATSAPP_TEMPLATE_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BACKUP_EMAIL
        sync: false

  # Runs backup_data.py weekly -- exports donors/donations/lookup lists to
  # a CSV zip and emails it to BACKUP_EMAIL (or ORG_CONTACT_EMAIL) if SMTP
  # is set up. This is a separate Render service from the web app with its
  # own (ephemeral, no `disk:`) filesystem -- a Render persistent disk can
  # only be attached to one service, so it can't share the web service's
  # instance/backups/ folder. Email is therefore the durable copy for the
  # automatic weekly run; use the "Download Backup Now" button in
  # Admin -> Settings -> Data Backup (or run `python backup_data.py` from
  # the web service's own Render Shell) if you also want a copy that
  # persists on the web service's disk.
  # NOTE: Cron Job services require a Render plan that supports them --
  # if yours doesn't, delete this block and instead run
  # `python backup_data.py` weekly from any external scheduler pointed at
  # this same repo (a free cron-job.org trigger, your own crontab, etc.).
  - type: cron
    name: temple-weekly-backup
    runtime: python
    schedule: "0 2 * * 0"   # every Sunday, 2 AM UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python backup_data.py --dest /tmp/temple-backups
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: temple-donation-db
          property: connectionString
      - key: SECRET_KEY
        sync: false   # same value as the web service's SECRET_KEY
      - key: ORG_CONTACT_EMAIL
        sync: false
      - key: BACKUP_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: temple-donation-db
    plan: basic-256mb   # Render's current entry-level Postgres tier (the old "starter" name was retired)
    databaseName: temple_donations
    user: temple_admin
