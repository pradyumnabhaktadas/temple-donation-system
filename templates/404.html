{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card card-body shadow-sm text-center p-4">
      <span style="font-size:2.2rem;">🪔</span>
      <h3 class="mt-2">Page Not Found</h3>
      <p class="text-muted">The page you're looking for doesn't exist, or may have moved. Please check the
        address, or head back to the donation page below.</p>
      <a class="btn btn-primary" href="{{ url_for('public.donate_form') }}">Go to Donate Page</a>
    </div>
  </div>
</div>
{% endblock %}
