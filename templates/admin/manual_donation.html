{% extends "admin/base_admin.html" %}
{% block title %}Log Offline Donation{% endblock %}
{% block content %}
<h3 class="mb-3">💵 Log Offline Donation (Cash / Cheque / Bank Transfer)</h3>
<form method="post" class="card card-body shadow-sm p-4" style="max-width:600px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Campaign / Purpose</label>
    <select class="form-select" name="campaign_id" id="campaign_id" required>
      {% for c in campaigns %}
      <option value="{{ c.id }}" data-name="{{ c.name }}">{{ c.name }} {% if not c.is_80g %}(Non-80G){% endif %}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3" id="bace-property-field" style="display:none;">
    <label class="form-label">BACE Property</label>
    <select class="form-select" name="bace_property_id" id="bace_property_id">
      <option value="">-- Select a property --</option>
      {% for p in bace_properties %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="row" id="festival-fields" style="display:none;">
    <div class="col-md-6 mb-3">
      <label class="form-label">Festival / Occasion</label>
      <select class="form-select" name="festival_id" id="festival_id">
        <option value="">-- Select a festival --</option>
        {% for f in festivals %}
        <option value="{{ f.id }}">{{ f.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Seva Type <span class="text-muted">(optional)</span></label>
      <select class="form-select" name="seva_type_id" id="seva_type_id">
        <option value="">-- General contribution --</option>
        {% for s in seva_types %}
        <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="mb-3" id="live-to-give-purpose-field" style="display:none;">
    <label class="form-label">Donation Purpose</label>
    <select class="form-select" name="live_to_give_purpose_id" id="live_to_give_purpose_id">
      <option value="">-- Select a purpose --</option>
      {% for p in live_to_give_purposes %}
      <option value="{{ p.id }}">{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="mb-3" id="live-to-give-receipt-type-field" style="display:none;">
    <label class="form-label">Receipt Required</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="receipt_type" id="receipt_type_80g" value="80g">
        <label class="form-check-label" for="receipt_type_80g">80G (To claim tax benefits)</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="receipt_type" id="receipt_type_non80g" value="non80g">
        <label class="form-check-label" for="receipt_type_non80g">Non 80G</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Amount (Rs.)</label>
      <input type="number" min="1" class="form-control" name="amount" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Payment Mode</label>
      <select class="form-select" name="payment_mode">
        <option value="cash">Cash</option>
        <option value="cheque">Cheque</option>
        <option value="bank_transfer">Bank Transfer</option>
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Donation Date</label>
    <input type="date" class="form-control" name="donation_date" value="{{ today.isoformat() }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Donor Full Name</label>
      <input type="text" class="form-control" name="full_name" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Phone</label>
      <input type="tel" class="form-control" name="phone">
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">WhatsApp Number <span class="text-muted">(if different from phone)</span></label>
      <input type="tel" class="form-control" name="whatsapp_number">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email">
    </div>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">PAN</label>
      <input type="text" class="form-control" name="pan" style="text-transform:uppercase" maxlength="10"
             pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]" title="10 characters, e.g. ABCDE1234F">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea class="form-control" name="address" rows="2"></textarea>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">City</label><input type="text" class="form-control" name="city"></div>
    <div class="col-md-4 mb-3"><label class="form-label">State</label><input type="text" class="form-control" name="state"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Pincode</label><input type="text" class="form-control" name="pincode"></div>
  </div>
  <div class="mb-3">
    <label class="form-label">Remarks</label>
    <input type="text" class="form-control" name="remarks">
  </div>
  <button type="submit" class="btn btn-gold">Save & Generate Receipt</button>
</form>
<script>
(function () {
  const campaignSelect = document.getElementById('campaign_id');
  const baceField = document.getElementById('bace-property-field');
  const baceSelect = document.getElementById('bace_property_id');
  const festivalFields = document.getElementById('festival-fields');
  const festivalSelect = document.getElementById('festival_id');
  const liveToGivePurposeField = document.getElementById('live-to-give-purpose-field');
  const liveToGivePurposeSelect = document.getElementById('live_to_give_purpose_id');
  const liveToGiveReceiptTypeField = document.getElementById('live-to-give-receipt-type-field');

  function syncConditionalFields() {
    const selected = campaignSelect.options[campaignSelect.selectedIndex];
    const name = selected ? selected.dataset.name : '';

    const isBaceContribution = name === 'BACE Contribution';
    baceField.style.display = isBaceContribution ? '' : 'none';
    baceSelect.required = isBaceContribution;
    if (!isBaceContribution) baceSelect.value = '';

    const isFestival = name === 'Festivals';
    festivalFields.style.display = isFestival ? '' : 'none';
    festivalSelect.required = isFestival;
    if (!isFestival) festivalSelect.value = '';

    const isLiveToGive = name === 'Live To Give';
    liveToGivePurposeField.style.display = isLiveToGive ? '' : 'none';
    liveToGiveReceiptTypeField.style.display = isLiveToGive ? '' : 'none';
    liveToGivePurposeSelect.required = isLiveToGive;
    if (!isLiveToGive) liveToGivePurposeSelect.value = '';
  }

  campaignSelect.addEventListener('change', syncConditionalFields);
  syncConditionalFields();
})();
</script>
{% endblock %}
