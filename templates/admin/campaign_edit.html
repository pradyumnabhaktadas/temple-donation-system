{% extends "admin/base_admin.html" %}
{% block title %}Edit Campaign{% endblock %}
{% block content %}
<a href="{{ url_for('admin.campaigns') }}">&larr; Back to Campaigns</a>
<h3 class="mt-2 mb-3">✏️ Edit Campaign</h3>
<form method="post" class="card card-body shadow-sm p-4" style="max-width:500px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-2">
    <label class="form-label" for="name">Name</label>
    <input type="text" class="form-control" name="name" id="name" value="{{ campaign.name }}" required>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="is_80g" id="is80g" {% if campaign.is_80g %}checked{% endif %}>
    <label class="form-check-label" for="is80g">80G Eligible</label>
  </div>
  <div class="form-check mb-2">
    <input class="form-check-input" type="checkbox" name="suppress_receipt" id="suppress_receipt" {% if campaign.suppress_receipt %}checked{% endif %}>
    <label class="form-check-label" for="suppress_receipt">No receipt (never issue a receipt number, PDF, or email/WhatsApp for this campaign)</label>
  </div>
  <div class="mb-2">
    <label class="form-label" for="target_amount">Target Amount (optional)</label>
    <input type="number" class="form-control" name="target_amount" id="target_amount" value="{{ campaign.target_amount or '' }}">
  </div>
  <div class="mb-2">
    <label class="form-label" for="min_amount">Minimum Donation Amount (optional)</label>
    <input type="number" class="form-control" name="min_amount" id="min_amount" value="{{ campaign.min_amount or '' }}" min="0" step="1">
    <div class="form-text">Leave blank for no minimum beyond Rs. 1. Shown to donors and enforced when they pay online.</div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="description">Description</label>
    <textarea class="form-control" name="description" id="description" rows="2">{{ campaign.description or '' }}</textarea>
  </div>
  <button class="btn btn-gold">Save Changes</button>
</form>
{% endblock %}
