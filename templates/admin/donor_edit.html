{% extends "admin/base_admin.html" %}
{% block title %}Edit Donor{% endblock %}
{% block content %}
<a href="{{ url_for('admin.donor_detail', donor_id=donor.id) }}">&larr; Back to {{ donor.full_name }}</a>
<h3 class="mt-2 mb-3">✏️ Edit Donor</h3>
<form method="post" class="card card-body shadow-sm p-4" style="max-width:600px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" class="form-control" name="full_name" value="{{ donor.full_name }}" required>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Phone</label>
      <input type="tel" class="form-control" name="phone" value="{{ donor.phone or '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" value="{{ donor.email or '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">WhatsApp Number <span class="text-muted">(if different from phone)</span></label>
    <input type="tel" class="form-control" name="whatsapp_number" value="{{ donor.whatsapp_number or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">PAN</label>
    <input type="text" class="form-control" name="pan" value="{{ donor.pan or '' }}" style="text-transform:uppercase" maxlength="10"
           pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]" title="10 characters, e.g. ABCDE1234F">
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea class="form-control" name="address" rows="2">{{ donor.address or '' }}</textarea>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">City</label><input type="text" class="form-control" name="city" value="{{ donor.city or '' }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">State</label><input type="text" class="form-control" name="state" value="{{ donor.state or '' }}"></div>
    <div class="col-md-4 mb-3"><label class="form-label">Pincode</label><input type="text" class="form-control" name="pincode" value="{{ donor.pincode or '' }}"></div>
  </div>
  <button class="btn btn-gold">Save Changes</button>
</form>
{% endblock %}
