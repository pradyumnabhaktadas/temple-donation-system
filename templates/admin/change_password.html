{% extends "admin/base_admin.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-3">🔑 {{ 'Set a New Password' if force else 'Change Password' }}</h3>
    {% if force %}
      <div class="alert alert-warning">For security, please set your own password before continuing.</div>
    {% endif %}
    <form method="post" class="card card-body shadow-sm p-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" minlength="8" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
